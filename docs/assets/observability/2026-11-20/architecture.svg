<text x="77" y="597" font-family="Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#2463b8">Процессы и правила</text>
<text x="77" y="633" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#52627a">Локальные признаки</text>
<text x="77" y="662" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#52627a">состояния</text>
