<desc>Целевая логическая схема. Разделение задач не означает добавление новых служб.</desc>
<rect width="100%" height="100%" fill="#f3f6fb"/>
<text x="42" y="45" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#2463b8">CUDY HOME GATEWAY · ПРОЕКТ ДЛЯ ОБСУЖДЕНИЯ · 20.11.2026</text>
<text x="42" y="102" font-family="Segoe UI,Arial,sans-serif" font-size="37" font-weight="700" fill="#14243b">Один набор фактов — статус, инциденты и история</text>
<text x="42" y="139" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#52627a">Целевая логическая схема. Разделение задач не означает добавление новых служб.</text>
