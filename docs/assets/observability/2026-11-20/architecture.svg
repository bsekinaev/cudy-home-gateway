<text x="457" y="550" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" fill="#14243b">Инциденты</text>
<text x="457" y="596" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#14243b">Подозрение → подтверждение</text>
<text x="457" y="626" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#14243b">3 плохих / 2 хороших измерения</text>
<text x="457" y="656" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#14243b">UNKNOWN не означает recovery</text>
<text x="457" y="686" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#14243b">Связанные проблемы учитываются</text>
