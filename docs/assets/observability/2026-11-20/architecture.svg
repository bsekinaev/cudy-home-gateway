<text x="77" y="493" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#52627a">Профиль и порт</text>
<text x="77" y="522" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="400" fill="#52627a">определены</text>
