name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # pull_request uses a synthetic merge SHA in github.sha; pin the reviewed head.
  HG_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  validate:
    name: Validate control plane
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      # Exact ucode revision validated on the target CUDY/OpenWrt runtime.
      UCODE_REV: 85922056ef7abeace3cca3ab28bc1ac2d88e31b1

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.HG_CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$HG_CANDIDATE_SHA"

      - name: Check changed-file whitespace
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            git fetch --no-tags origin "${GITHUB_BASE_REF}"
            git diff --check "origin/${GITHUB_BASE_REF}...HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --check --format= HEAD
          fi

      - name: Install ucode build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            busybox \
            build-essential \
            cmake \
            pkg-config \
            libjson-c-dev \
            libmd-dev \
            zlib1g-dev

      - name: Build target-compatible ucode
        shell: bash
        run: |
          set -euo pipefail

          git clone --filter=blob:none https://github.com/jow-/ucode.git /tmp/ucode
          git -C /tmp/ucode checkout --detach "${UCODE_REV}"

          cmake \
            -S /tmp/ucode \
            -B /tmp/ucode-build \
            -DFS_SUPPORT=ON \
            -DMATH_SUPPORT=ON \
            -DSTRUCT_SUPPORT=ON \
            -DUBUS_SUPPORT=OFF \
            -DUCI_SUPPORT=OFF \
            -DULOOP_SUPPORT=OFF \
            -DNL80211_SUPPORT=OFF \
            -DRESOLV_SUPPORT=OFF \
            -DRTNL_SUPPORT=OFF

          cmake --build /tmp/ucode-build --parallel 2
          sudo cmake --install /tmp/ucode-build
          sudo ldconfig

          ucode -e 'print("ucode-ci-ok\n")'

      - name: Run repository CI checks
        run: |
          # These native fixtures exercise root ownership and real fsync.
          # Ubuntu's reduced BusyBox lacks fsync; install the pinned host build
          # only on this disposable CI worker, never in a release/router kit.
          work=$(mktemp -d)
          curl -fsSL --retry 2 https://busybox.net/downloads/busybox-1.37.0.tar.bz2 -o "$work/source.tar.bz2"
          echo "3311dff32e746499f4df0d5df04d7eb396382d7e108bb9250e7b519b837043a4  $work/source.tar.bz2" | sha256sum -c -
          tar -xjf "$work/source.tar.bz2" -C "$work"
          make -C "$work/busybox-1.37.0" defconfig > "$work/config.log" 2>&1
          sed -i 's/^CONFIG_TC=y/# CONFIG_TC is not set/' "$work/busybox-1.37.0/.config"
          make -C "$work/busybox-1.37.0" -j2 > "$work/build.log" 2>&1
          sudo install -m 755 "$work/busybox-1.37.0/busybox" /bin/busybox
          /bin/busybox --list | grep -Fx fsync
          sudo env "PATH=$PATH" GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" ./scripts/ci/check.sh

      - name: Test release bundle builder
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v

      - name: Verify owner update candidate release boundaries
        run: python3 -m unittest discover -s scripts/owner_update -p 'test_*.py' -v

      - name: Verify sequential owner update contracts
        run: sudo env "PATH=$PATH" GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" python3 -m unittest discover -s scripts/owner_series -p 'test_*.py' -v

      # The distribution's minimal BusyBox omits flock/fsync. Run the entire
      # deployment suite on pinned 1.37 with mandatory applet checks instead.
      - name: Deployment, crash recovery and regression on pinned BusyBox 1.37.0
        run: sudo env "PATH=$PATH" GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory GIT_CONFIG_VALUE_0="$GITHUB_WORKSPACE" ./scripts/ci/check-busybox137.sh

      - name: Build release bundle
        run: python3 scripts/release/build.py --ref HEAD --output dist

      - name: Verify release archive checksum
        working-directory: dist
        run: sha256sum -c *.sha256

      - name: Verify complete release format
        shell: bash
        run: |
          set -euo pipefail
          archive=(dist/*.tar.gz)
          read -r digest _ < "${archive[0]}.sha256"
          python3 scripts/release/verify.py "${archive[0]}" --commit "$HG_CANDIDATE_SHA" --sha256 "$digest"

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: home-gateway-${{ env.HG_CANDIDATE_SHA }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  isolated-openwrt:
    name: Networkless OpenWrt procd and reboot smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.HG_CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$HG_CANDIDATE_SHA"
      - name: Install host VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 e2fsprogs
      - name: Fetch public immutable inputs and pinned signed repository
        shell: bash
        run: |
          set -euo pipefail
          mkdir vm-inputs
          curl --fail --location --retry 3 https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-25.12.5-x86-64-generic-kernel.bin -o vm-inputs/kernel.bin
          curl --fail --location --retry 3 https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-25.12.5-x86-64-generic-ext4-rootfs.img.gz -o vm-inputs/rootfs.img.gz
          cp scripts/openwrt/fixtures/packages.adb vm-inputs/packages.adb
          for name in coreutils-9.9-r2.apk coreutils-base64-9.9-r2.apk coreutils-stat-9.9-r2.apk coreutils-timeout-9.9-r2.apk; do
            curl --fail --location --retry 3 "https://downloads.openwrt.org/releases/25.12.5/packages/x86_64/packages/$name" -o "vm-inputs/$name"
          done
          # run_vm validates every fixed SHA before opening QEMU. The signed public
          # repository index is vendored byte-for-byte; never refresh its pin silently.
      - name: Run synthetic native restore, procd actions and reboot admission
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/openwrt/run_vm.py --kernel vm-inputs/kernel.bin --rootfs vm-inputs/rootfs.img.gz --packages-directory vm-inputs --ref "$HG_CANDIDATE_SHA" > vm-report.json || { cat vm-report.json; exit 1; }
          cat vm-report.json
      - name: Run bounded native legacy snapshot scenario
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/openwrt/run_vm.py --kernel vm-inputs/kernel.bin --rootfs vm-inputs/rootfs.img.gz --packages-directory vm-inputs --ref "$HG_CANDIDATE_SHA" --scenario legacy-snapshot > vm-snapshot-report.json || { cat vm-snapshot-report.json; exit 1; }
          cat vm-snapshot-report.json
      - name: Run bounded native candidate staging scenario
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/openwrt/run_vm.py --kernel vm-inputs/kernel.bin --rootfs vm-inputs/rootfs.img.gz --packages-directory vm-inputs --ref "$HG_CANDIDATE_SHA" --scenario candidate-snapshot > vm-candidate-report.json || { cat vm-candidate-report.json; exit 1; }
          cat vm-candidate-report.json
      - name: Verify native runtime and journal rollback
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/openwrt/run_vm.py --kernel vm-inputs/kernel.bin --rootfs vm-inputs/rootfs.img.gz --packages-directory vm-inputs --ref "$HG_CANDIDATE_SHA" --scenario runtime-cycle > vm-runtime-cycle-report.json || { cat vm-runtime-cycle-report.json; exit 1; }
          cat vm-runtime-cycle-report.json
      - name: Verify overlay identity across guest reboot and supervised cold boot
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/openwrt/run_vm.py --kernel vm-inputs/kernel.bin --rootfs vm-inputs/rootfs.img.gz --packages-directory vm-inputs --ref "$HG_CANDIDATE_SHA" --scenario overlay-identity > vm-overlay-report.json || { cat vm-overlay-report.json; exit 1; }
          cat vm-overlay-report.json
      - name: Upload public report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: isolated-openwrt-${{ env.HG_CANDIDATE_SHA }}
          path: |
            vm-report.json
            vm-snapshot-report.json
            vm-candidate-report.json
            vm-overlay-report.json
            vm-runtime-cycle-report.json
          if-no-files-found: ignore
          retention-days: 30

  native-crash:
    name: Native crash recovery (${{ matrix.scenario }})
    runs-on: ubuntu-24.04
    # Retirement scenario exercises two full transactions plus SIGKILL/reboot.
    timeout-minutes: ${{ (matrix.scenario == 'owner-series' || matrix.scenario == 'owner-monitor') && 150 || matrix.scenario == 'owner-update' && 35 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        scenario: [owner-monitor, owner-series, owner-update, retirement-reboot, rc-b-root-cycle, rc-b-crash-apply, rc-b-crash-restore, runtime-crash-apply, runtime-crash-restore, runtime-crash-phase, rc-a-package, control-cycle, service-cycle]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HG_CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$HG_CANDIDATE_SHA"
      - name: Install isolated VM tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 e2fsprogs
      - name: Fetch and verify immutable public VM inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir vm-inputs
          curl --fail --location --retry 3 https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-25.12.5-x86-64-generic-kernel.bin -o vm-inputs/kernel.bin
          curl --fail --location --retry 3 https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-25.12.5-x86-64-generic-ext4-rootfs.img.gz -o vm-inputs/rootfs.img.gz
          cp scripts/openwrt/fixtures/packages.adb vm-inputs/packages.adb
          for name in coreutils-9.9-r2.apk coreutils-base64-9.9-r2.apk coreutils-stat-9.9-r2.apk coreutils-timeout-9.9-r2.apk; do
            curl --fail --location --retry 3 "https://downloads.openwrt.org/releases/25.12.5/packages/x86_64/packages/$name" -o "vm-inputs/$name"
          done
      - name: Run actual SIGKILL and guest reboot recovery
        shell: bash
        env:
          HG_SCENARIO: ${{ matrix.scenario }}
        run: |
          set -euo pipefail
          # Inputs and redirected reports are untracked workspace files. Build
          # only from an independent clean checkout, preserving SOURCE_DIRTY.
          clean=$(mktemp -d)
          git clone --quiet --no-hardlinks . "$clean/source"
          python3 "$clean/source/scripts/openwrt/run_vm.py" --kernel "$GITHUB_WORKSPACE/vm-inputs/kernel.bin" --rootfs "$GITHUB_WORKSPACE/vm-inputs/rootfs.img.gz" --packages-directory "$GITHUB_WORKSPACE/vm-inputs" --ref "$HG_CANDIDATE_SHA" --scenario "$HG_SCENARIO" > vm-crash-report.json || { cat vm-crash-report.json; exit 1; }
          cat vm-crash-report.json
      - name: Upload public report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-crash-${{ matrix.scenario }}-${{ env.HG_CANDIDATE_SHA }}-${{ github.run_attempt }}
          path: vm-crash-report.json
          retention-days: 30

  owner-windows:
    name: Owner installer on Windows PowerShell 5.1
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HG_CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate checkout
        shell: powershell
        run: if ((git rev-parse HEAD) -ne $env:HG_CANDIDATE_SHA) { throw 'Wrong candidate source' }
      - name: Test owner runner without router access
        shell: powershell
        run: python -m unittest discover -s scripts/owner_series -p 'test_owner*.py' -v
