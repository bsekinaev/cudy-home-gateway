name: Build immutable RC-B 20261020.2

on:
  push:
    branches: ["feature/rc-b-20261020-2-package"]

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UCODE_REV: 85922056ef7abeace3cca3ab28bc1ac2d88e31b1
    steps:
      - name: Checkout accepted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 62592457237e7f026786c086d1ca6fdd4b6c095d
          fetch-depth: 0
          persist-credentials: false
      - name: Install ucode build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            busybox \
            build-essential \
            cmake \
            pkg-config \
            libjson-c-dev \
            libmd-dev \
            zlib1g-dev

      - name: Build target-compatible ucode
        shell: bash
        run: |
          set -euo pipefail

          git clone --filter=blob:none https://github.com/jow-/ucode.git /tmp/ucode
          git -C /tmp/ucode checkout --detach "${UCODE_REV}"

          cmake \
            -S /tmp/ucode \
            -B /tmp/ucode-build \
            -DFS_SUPPORT=ON \
            -DMATH_SUPPORT=ON \
            -DSTRUCT_SUPPORT=ON \
            -DUBUS_SUPPORT=OFF \
            -DUCI_SUPPORT=OFF \
            -DULOOP_SUPPORT=OFF \
            -DNL80211_SUPPORT=OFF \
            -DRESOLV_SUPPORT=OFF \
            -DRTNL_SUPPORT=OFF

          cmake --build /tmp/ucode-build --parallel 2
          sudo cmake --install /tmp/ucode-build
          sudo ldconfig

          ucode -e 'print("ucode-ci-ok\n")'


      - name: Verify owner runner on actual PowerShell
        run: |
          command -v pwsh
          python3 -m unittest discover -s scripts/migration_rc -p 'test_*.py' -v
      - name: Build only from successful exact-source acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_ACCEPTANCE_URL: https://github.com/bsekinaev/cudy-home-gateway/pull/29#issuecomment-6300526418
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,hashlib,importlib.util,json,os,pathlib,re,subprocess,tarfile,urllib.request
          SOURCE='62592457237e7f026786c086d1ca6fdd4b6c095d'
          RUN=39490486354
          REPO='bsekinaev/cudy-home-gateway'
          def api(path):
           req=urllib.request.Request('https://api.github.com/repos/'+REPO+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
           with urllib.request.urlopen(req,timeout=60) as r:return r.read()
          run=json.loads(api('/actions/runs/'+str(RUN)))
          assert run['head_sha']==SOURCE and run['status']=='completed' and run['conclusion']=='success','SOURCE_CI_NOT_ACCEPTED'
          jobs=json.loads(api('/actions/runs/'+str(RUN)+'/jobs?per_page=100'))['jobs']
          assert len(jobs)==12 and all(j['conclusion']=='success' for j in jobs),'SOURCE_JOBS_NOT_ACCEPTED'
          reports={}
          for job in jobs:
           if job['name']=='Validate control plane':continue
           log=api('/actions/jobs/'+str(job['id'])+'/logs').decode()
           for line in log.splitlines():
            start=line.find('{"checks":')
            if start<0:continue
            report=json.loads(line[start:])
            assert report['commit']==SOURCE and report['status']=='PASS' and report['failed']==0
            assert report['scenario'] not in reports
            reports[report['scenario']]=report
          assert len(reports)==15
          required={'rc-b-root-cycle','rc-b-crash-apply','rc-b-crash-restore','overlay-identity','service-cycle','retirement-reboot'}
          acceptance=dict(format='HG_DELIVERY_B_ACCEPTANCE_V1',commit=SOURCE,ci_head=SOURCE,ci_conclusion='success',ci_url=run['html_url'],review_blockers=0,review_acceptance_url=os.environ['REVIEW_ACCEPTANCE_URL'],reports={k:reports[k] for k in sorted(required)},additional_reports={k:reports[k] for k in sorted(set(reports)-required)},owner_evidence=dict(previous_attempt='a7376b1d-2405-440b-9349-e5e94cb88ae6',previous_source='6b7d3ada6fe6b513e08db22469ccde10a6d47ee3',apply='SELFTEST_62_PASS_DOCTOR_ASATA_FAIL_NOT_COMMITTED',rollback='OWNER_REPORTED_ROLLED_BACK_SELFTEST_58_PASS_DOCTOR_11_OK_VERIFY_PASS',current_candidate_live='NOT_RUN',backup_restore='NOT_TESTED'),scope='VM acceptance is not CUDY installation evidence')
          raw=(json.dumps(acceptance,sort_keys=True,indent=2)+'\n').encode()
          out=pathlib.Path('rc-b-20261020.2');out.mkdir()
          (out/'acceptance.json').write_bytes(raw)
          spec=importlib.util.spec_from_file_location('builder','scripts/migration_rc/build_b.py');b=importlib.util.module_from_spec(spec);spec.loader.exec_module(b)
          one=b.build(pathlib.Path.cwd(),SOURCE,out,'owner',raw)
          two=b.build(pathlib.Path.cwd(),SOURCE,pathlib.Path('duplicate'),'owner',raw)
          assert one.read_bytes()==two.read_bytes(),'NONDETERMINISTIC'
          manifest=json.loads((out/'manifest.json').read_text())
          install=[]
          receiver={'usr/libexec/home-gateway-deploy/engine.sh','usr/libexec/home-gateway-deploy/wrapper.sh','etc/init.d/home-gateway-deploy-recover'}
          for row in manifest['files']:
           p=row['path'];prefix=next((x for x in ('candidate/','controls/') if p.startswith(x)),None)
           if prefix is None or p.endswith('.sha256'):continue
           item=dict(row);item['mode_octal']=format(row['mode'],'04o');item['install_path']='/'+p[len(prefix):];item['category']='control' if prefix=='controls/' else 'receiver' if p[len(prefix):] in receiver else 'runtime';install.append(item)
          assert {k:sum(x['category']==k for x in install) for k in ('runtime','receiver','control')}==dict(runtime=20,receiver=3,control=11)
          (out/'install-manifest.json').write_text(json.dumps(install,sort_keys=True,indent=2)+'\n')
          def digest(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          (out/'owner-b.ps1.sha256').write_text(digest(out/'owner-b.ps1')+'  owner-b.ps1\n')
          release=dict(version='20261020.2',source_commit=SOURCE,ci=run['html_url'],bundle=one.name,bundle_sha256=digest(one),runner_sha256=digest(out/'owner-b.ps1'),manifest_sha256=digest(out/'manifest.json'),vm_checks=sum(x['total'] for x in reports.values()),vm_failed=0,production_apply='OWNER_MANUAL_ONLY',previous_apply_replay='FORBIDDEN')
          (out/'release.json').write_text(json.dumps(release,sort_keys=True,indent=2)+'\n')
          (out/'SHA256SUMS').write_text(''.join(digest(p)+'  '+p.name+'\n' for p in sorted(out.iterdir()) if p.is_file()))
          with tarfile.open(one) as t:
           assert all(not m.issym() and not m.islnk() and '..' not in pathlib.PurePosixPath(m.name).parts and not m.name.startswith('/') for m in t.getmembers())
          kit=subprocess.check_output(['sudo','mktemp','-d','/tmp/hg-rc-b-package.XXXXXX'],text=True).strip()
          subprocess.run(['sudo','tar','-xzpf',str(one),'-C',kit],check=True)
          subprocess.run(['sudo','/usr/local/bin/ucode',kit+'/rc-b.uc',kit,'check',release['manifest_sha256']],check=True)
          subprocess.run(['pwsh','-NoProfile','-Command',"$e=$null; $t=$null; [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '"+str(out/'owner-b.ps1')+"'),[ref]$t,[ref]$e); if($e.Count){throw ($e|Out-String)}"],check=True)
          print('RCB_RELEASE='+json.dumps(release,sort_keys=True))
          for p in sorted(out.iterdir()):
           if not p.is_file():continue
           data=p.read_bytes()
           print('RCB_META='+json.dumps(dict(name=p.name,size=len(data),sha256=digest(p))))
           for i in range(0,len(data),8190):print('RCB_BYTES '+p.name+' '+str(i//8190)+' '+base64.b64encode(data[i:i+8190]).decode())
          
          PY
      - name: Upload immutable candidate output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hgdeploy2-rc-b-20261020.2
          path: rc-b-20261020.2/
          if-no-files-found: error
          retention-days: 30
